# Adapted from hackerschoice/segfault (guest/fs-root/etc/ssh/ssh_config.d/segfault.conf)
# Deviations: host keys are verified with accept-new instead of disabled, and
# IdentitiesOnly is left per-host (global agent use stays functional).
# Legacy algorithms are re-enabled so old CTF/lab targets still negotiate.

ConnectTimeout 10
ServerAliveInterval 15
ServerAliveCountMax 3

# legacy targets (ssh-rsa hosts, group1/14-sha1 kex)
KexAlgorithms +diffie-hellman-group1-sha1,diffie-hellman-group14-sha1
HostKeyAlgorithms +ssh-rsa
PubkeyAcceptedAlgorithms +ssh-rsa

Host *
    StrictHostKeyChecking accept-new
    HashKnownHosts yes

# no shell history / no MOTD noise on targets
Host *
    LogLevel ERROR